<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBK Community Donation Tracking System — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
    <main class="login-page">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-logo"><img src="photo.png/logo1.png" alt="KBK logo"></div>
            <p class="login-eyebrow">KBK COMMUNITY DONATION TRACKING SYSTEM</p>
            <h2 id="loginTitle">Administrator Login</h2>
            <p class="subtitle">Sign in to manage official donation and community records.</p>
            <div class="alert alert-success" id="loginSuccess" role="status" aria-live="polite" hidden></div>
            <div class="alert alert-danger" id="loginError" role="alert" aria-live="polite" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Email</label>
                    <input class="form-control" type="email" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="login-password-field">
                        <input class="form-control" type="password" id="password" autocomplete="current-password" required>
                        <button class="login-password-toggle" id="togglePassword" type="button" aria-controls="password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button class="btn btn-primary login-submit" id="loginSubmit" type="submit">Sign In</button>
            </form>
            <p class="login-hint">Sign in with the email and password assigned to your KBK account. Contact an administrator if you need access.</p>
            <a href="index.html" class="login-back">Return to public site</a>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
